<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>iCalc</title>
  <link rel="stylesheet" href="styles.css">
<script>localStorage.setItem("icalc.history.v1", "[{\"expr\":\"12+7├ù3\",\"value\":33,\"display\":\"33\",\"ts\":1792943509710},{\"expr\":\"50+10%\",\"value\":55,\"display\":\"55\",\"ts\":1792943509710},{\"expr\":\"sin(30)\",\"value\":0.5,\"display\":\"0.5\",\"ts\":1792943509710},{\"expr\":\"120├╖4\",\"value\":30,\"display\":\"30\",\"ts\":1792943509710}]");</script></head>
<body>
  <div class="stage">
    <div class="watermark" aria-hidden="true">
      <span class="wm-mark">iCalc</span>
      <span class="wm-sub">A calculator for everything.</span>
    </div>

    <div class="device" id="device">
      <div class="app" id="app">

        <header class="topbar">
          <button class="icon-btn" id="modeBtn" aria-label="Choose mode" aria-haspopup="true" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="3" width="16" height="18" rx="3.5"></rect>
              <path d="M8 8h8"></path>
              <circle cx="8.2" cy="12.4" r=".6" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="12.4" r=".6" fill="currentColor" stroke="none"></circle>
              <circle cx="15.8" cy="12.4" r=".6" fill="currentColor" stroke="none"></circle>
              <circle cx="8.2" cy="16.2" r=".6" fill="currentColor" stroke="none"></circle>
              <circle cx="12" cy="16.2" r=".6" fill="currentColor" stroke="none"></circle>
              <circle cx="15.8" cy="16.2" r=".6" fill="currentColor" stroke="none"></circle>
            </svg>
          </button>
          <div class="mode-label" id="modeLabel">Basic</div>
          <button class="icon-btn" id="historyBtn" aria-label="History" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5"></circle>
              <path d="M12 7.5V12l3 1.8"></path>
            </svg>
          </button>
        </header>

        <!-- BASIC / SCIENTIFIC -->
        <section class="screen screen-calc" id="calcScreen">
          <div class="display">
            <div class="display-top">
              <button class="angle-chip" id="angleChip" hidden="" aria-label="Toggle angle mode">DEG</button>
              <div class="display-sub" id="displaySub"></div>
            </div>
            <div class="display-main" id="displayMain">0</div>
          </div>
          <div class="keypad" id="keypad"><button class="key fn" type="button" data-a="clear" aria-label="all clear">AC</button><button class="key fn" type="button" data-a="sign" aria-label="toggle sign">┬▒</button><button class="key fn" type="button" data-a="percent" aria-label="percent">%</button><button class="key op" type="button" data-a="op" data-v="├╖" aria-label="├╖">├╖</button><button class="key num" type="button" data-a="digit" data-v="7" aria-label="digit 7">7</button><button class="key num" type="button" data-a="digit" data-v="8" aria-label="digit 8">8</button><button class="key num" type="button" data-a="digit" data-v="9" aria-label="digit 9">9</button><button class="key op" type="button" data-a="op" data-v="├ù" aria-label="├ù">├ù</button><button class="key num" type="button" data-a="digit" data-v="4" aria-label="digit 4">4</button><button class="key num" type="button" data-a="digit" data-v="5" aria-label="digit 5">5</button><button class="key num" type="button" data-a="digit" data-v="6" aria-label="digit 6">6</button><button class="key op" type="button" data-a="op" data-v="ΓêÆ" aria-label="minus">ΓêÆ</button><button class="key num" type="button" data-a="digit" data-v="1" aria-label="digit 1">1</button><button class="key num" type="button" data-a="digit" data-v="2" aria-label="digit 2">2</button><button class="key num" type="button" data-a="digit" data-v="3" aria-label="digit 3">3</button><button class="key op" type="button" data-a="op" data-v="+" aria-label="+">+</button><button class="key num wide" type="button" data-a="digit" data-v="0" aria-label="digit 0">0</button><button class="key num" type="button" data-a="dot" aria-label=".">.</button><button class="key op" type="button" data-a="equals" aria-label="equals">=</button></div>
        </section>

        <!-- UNIT CONVERSION -->
        <section class="screen screen-convert" id="convertScreen" hidden="">
          <div class="cat-scroll" id="catScroll" role="tablist" aria-label="Conversion categories"><button type="button" class="cat" data-cat="length" role="tab">Length</button><button type="button" class="cat" data-cat="mass" role="tab">Weight</button><button type="button" class="cat" data-cat="temperature" role="tab">Temperature</button><button type="button" class="cat" data-cat="speed" role="tab">Speed</button><button type="button" class="cat" data-cat="volume" role="tab">Volume</button><button type="button" class="cat" data-cat="area" role="tab">Area</button><button type="button" class="cat" data-cat="time" role="tab">Time</button><button type="button" class="cat" data-cat="data" role="tab">Data</button><button type="button" class="cat" data-cat="energy" role="tab">Energy</button><button type="button" class="cat" data-cat="pressure" role="tab">Pressure</button><button type="button" class="cat" data-cat="angle" role="tab">Angle</button><button type="button" class="cat" data-cat="currency" role="tab">Currency</button></div>

          <div class="conv-panels">
            <div class="conv-card">
              <div class="conv-label">From</div>
              <div class="conv-field">
                <input id="convValue" class="conv-input" type="text" inputmode="decimal" value="1" aria-label="Value to convert" autocomplete="off" spellcheck="false">
                <div class="conv-unit-select">
                  <select id="convFrom" aria-label="From unit"></select>
                  <svg viewBox="0 0 24 24" class="chev" aria-hidden="true"><path d="M8 10l4 4 4-4"></path></svg>
                </div>
              </div>
            </div>

            <button class="swap-btn" id="swapBtn" aria-label="Swap units">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v13M7 17l-3-3M7 17l3-3M17 20V7M17 7l-3 3M17 7l3 3"></path></svg>
            </button>

            <div class="conv-card conv-result-card">
              <div class="conv-label">To</div>
              <div class="conv-field">
                <div class="conv-out" id="convOut">3.28084</div>
                <div class="conv-unit-select">
                  <select id="convTo" aria-label="To unit"></select>
                  <svg viewBox="0 0 24 24" class="chev" aria-hidden="true"><path d="M8 10l4 4 4-4"></path></svg>
                </div>
              </div>
            </div>
          </div>

          <div class="conv-note">
            <span id="convFormula"></span>
            <span class="rate-badge" id="rateBadge" hidden=""></span>
          </div>

          <div class="conv-list-wrap">
            <div class="conv-list-head">Also equals</div>
            <div class="conv-list" id="convList"></div>
          </div>
        </section>

        <!-- MATH NOTES -->
        <section class="screen screen-notes" id="notesScreen" hidden="">
          <div class="notes-scroll" id="notesScroll">
            <div class="notes-toolbar">
              <span class="notes-hint">Type an expression, then add <b>=</b></span>
              <button class="text-btn" id="clearNotes">Clear</button>
            </div>
            <div class="vars-bar" id="varsBar"></div>
            <div class="note-lines" id="noteLines"><div class="note-line"><span class="row-num">1</span><input class="note-input" type="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" data-index="0" aria-label="Math note line 1" placeholder="Try 12 + 7 ="><span class="note-result"></span></div></div>

            <div class="graph-card" id="graphCard" hidden="">
              <div class="graph-head">
                <span class="graph-title">Graph</span>
                <div class="graph-actions">
                  <button data-graph="out" aria-label="Zoom out">ΓêÆ</button>
                  <button data-graph="in" aria-label="Zoom in">+</button>
                  <button data-graph="reset" class="graph-reset">Reset</button>
                </div>
              </div>
              <div class="graph-canvas-wrap">
                <canvas id="graphCanvas"></canvas>
              </div>
              <div class="graph-legend" id="graphLegend"></div>
            </div>
          </div>
        </section>

        <!-- MODE MENU -->
        <div class="mode-menu open" id="modeMenu" role="menu" aria-hidden="false">
          <button class="mode-item active" data-mode="basic" role="menuitem">
            <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"></rect><path d="M8.5 8h7"></path><circle cx="9" cy="12.5" r=".7" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12.5" r=".7" fill="currentColor" stroke="none"></circle><circle cx="15" cy="12.5" r=".7" fill="currentColor" stroke="none"></circle><circle cx="9" cy="16" r=".7" fill="currentColor" stroke="none"></circle><circle cx="12" cy="16" r=".7" fill="currentColor" stroke="none"></circle><circle cx="15" cy="16" r=".7" fill="currentColor" stroke="none"></circle></svg>
            <span>Basic</span><span class="check">Γ£ô</span>
          </button>
          <button class="mode-item" data-mode="scientific" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M4 18c3.5 0 5.5-12 9-12 2.2 0 3.5 2.5 3.5 6S15.2 18 17 18h3"></path><path d="M4 18h1"></path></svg>
            <span>Scientific</span><span class="check">Γ£ô</span>
          </button>
          <button class="mode-item" data-mode="notes" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M5 4.5h14v15H5z"></path><path d="M8 9h8M8 12.5h5"></path><path d="M8 16.5h3"></path></svg>
            <span>Math Notes</span><span class="check">Γ£ô</span>
          </button>
          <button class="mode-item" data-mode="convert" role="menuitem">
            <svg viewBox="0 0 24 24"><path d="M4 8h13M13 4l4 4-4 4"></path><path d="M20 16H7M11 12l-4 4 4 4"></path></svg>
            <span>Unit Conversion</span><span class="check">Γ£ô</span>
          </button>
        </div>

        <!-- HISTORY -->
        <div class="scrim" id="scrim"></div>
        <section class="sheet" id="historySheet" aria-hidden="true" aria-label="History">
          <div class="sheet-grabber"></div>
          <div class="sheet-head">
            <h2>History</h2>
            <button id="clearHistory">Clear</button>
          </div>
          <div class="history-list" id="historyList"><div class="history-item" role="button" tabindex="0"><div class="history-main"><div class="history-expr">12+7├ù3</div><div class="history-result">33</div></div><button class="history-copy" type="button" aria-label="Copy result"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"></path></svg></button></div><div class="history-item" role="button" tabindex="0"><div class="history-main"><div class="history-expr">50+10%</div><div class="history-result">55</div></div><button class="history-copy" type="button" aria-label="Copy result"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"></path></svg></button></div><div class="history-item" role="button" tabindex="0"><div class="history-main"><div class="history-expr">sin(30)</div><div class="history-result">0.5</div></div><button class="history-copy" type="button" aria-label="Copy result"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"></path></svg></button></div><div class="history-item" role="button" tabindex="0"><div class="history-main"><div class="history-expr">120├╖4</div><div class="history-result">30</div></div><button class="history-copy" type="button" aria-label="Copy result"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5.5A1.5 1.5 0 0 1 6.5 4H15"></path></svg></button></div></div>
        </section>

        <div class="toast" id="toast" role="status"></div>
      </div>
    </div>
  </div>

  <script src="math.js"></script>
  <script src="units.js"></script>
  <script src="app.js"></script>
  <script src="convert.js"></script>
  <script src="notes.js"></script>
  <script>window.__icalc.boot();</script>
<script>setTimeout(function(){document.querySelector("#modeBtn").click();}, 250);</script>

</body></html>
